[package]
name = "vault-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
rpassword = "7.3"
aes-gcm = { version = "0.10", features = ["std"] }
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
argon2 = { version = "0.5", features = ["std"] }
# sha2 = "0.10"  # Descomenta solo si lo usas en otro módulo